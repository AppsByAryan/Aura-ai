name: Build AURA APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Prevent infinite loop: the bot commit that bumps version.txt must not re-trigger
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate AURA version
        id: version
        shell: bash
        run: |
          CURRENT=$(cat version.txt)

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)

          MINOR=$((MINOR + 1))

          NEW_VERSION="$MAJOR.$MINOR"

          echo "$NEW_VERSION" > version.txt
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "AURA VERSION: $NEW_VERSION"

      - name: Decode release keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Create the keystore and add the required repository secrets before building."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/aura-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/aura-release.jks" >> "$GITHUB_ENV"
          # Do not print any secret material
          ls -la "$GITHUB_WORKSPACE/aura-release.jks"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Aura-ai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/Aura-ai.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AURA V${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/Aura-ai.apk
          generate_release_notes: true

      - name: Save new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.txt

          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: bump AURA version to v${{ steps.version.outputs.version }}"
            git push
          fi
